[project]
name = "break-ia"
version = "0.2.0"
description = "Agente híbrido de recomendaciones para cafeterías universitarias (BREAK IA Fase 2)."
readme = "README.md"
license = "GPL-3.0-or-later AND CC-BY-4.0"
authors = [
    { name = "BreakApp AI Team", email = "andres.rubianoc@utadeo.edu.co" }
]
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.2; platform_system == \"Windows\""]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.16.4"]

[project.scripts]
break-ia = "break_ia.agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "__marimo__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "N",
]
